<!-- EdgeDiagram's state machines and swimlanes: point shapes met at their middle, self-transitions, opposite
     transitions kept apart, composites, lanes that hold and fit their nodes, a walk through the states,
     and the checks that come with them. Run with scripts/test.sh. -->
<svg id="sm" viewBox="0 0 700 420"></svg>
<svg id="ln" viewBox="0 0 700 200"></svg>
<svg id="vl" viewBox="0 0 500 400"></svg>
<svg id="bad" viewBox="0 0 700 400"></svg>
<svg id="nog" viewBox="0 0 300 120"></svg>
<pre id="out"></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../lib/edgediagram.js"></script>
<script>
var bad = [];
function expect(list, want, what) {
  want.forEach(function (w) { if (!list.some(function (m) { return m.indexOf(w) >= 0; })) bad.push(what + ': missing "' + w + '" in ' + JSON.stringify(list)); });
}
function near(a, b, what, tol) { if (Math.abs(a - b) > (tol || 0.6)) bad.push(what + ': ' + a + ' want ' + b); }
function ends(d, id) { var p = d.items[id].path, n = p.getTotalLength(), a = p.getPointAtLength(0), b = p.getPointAtLength(n); return [[a.x, a.y], [b.x, b.y]]; }
function corners(d, id) { return d.items[id].path.getAttribute('d').match(/[ML][^MLQ]*/g).map(function (s) { return s.slice(1).trim().split(/\s+/).map(Number); }); }

// ---------- a state machine ----------
var d = EdgeDiagram.create(document.getElementById('sm'));
d.node('init', {x: 30, y: 71, w: 18, h: 18, shape: 'initial'})
 .node('a', {x: 100, y: 52, w: 140, h: 56, shape: 'state', title: 'Idle'})
 .node('comp', {x: 360, y: 20, w: 320, h: 260, shape: 'composite', title: 'Running'})
 .node('b', {x: 450, y: 70, w: 140, h: 56, shape: 'state', title: 'Busy'})
 .node('c', {x: 450, y: 200, w: 140, h: 56, shape: 'state', title: 'Waiting'})
 .node('ch', {x: 155, y: 220, w: 30, h: 30, shape: 'choice'})
 .node('end', {x: 158, y: 340, w: 24, h: 24, shape: 'final'});
d.transition('t0', {from: 'init', to: ['a', 'left'], event: 'boot'})
 .transition('go', {from: ['a', 'right'], to: ['comp', 'left'], event: 'start'})
 .transition('bc', {from: ['b', 'bottom'], to: ['c', 'top'], event: 'block', guard: 'no input', action: 'park'})
 .transition('cb', {from: ['c', 'top'], to: ['b', 'bottom'], event: 'ready'})
 .transition('self', {from: 'b', to: 'b', side: 'right', event: 'tick'})
 .transition('q', {from: ['a', 'bottom'], to: ['ch', 'top']})
 .transition('fin', {from: ['ch', 'bottom'], to: ['end', 'top'], guard: 'done'});
var issues = d.check();
if (issues.length) bad.push('state machine: ' + issues.join(' / '));
// a dot and a diamond are met at the middle of their side
near(ends(d, 't0')[0][1], 80, 'initial dot met at its middle');
near(ends(d, 'q')[1][0], 170, 'choice met at its top vertex');
if (!d.items.init.el.querySelector('circle.ed-shape') || !d.items.end.el.querySelector('circle.ed-core')) bad.push('dot shapes');
if (!d.items.ch.el.querySelector('polygon.ed-shape')) bad.push('choice is not a diamond');
// the label reads event [guard] / action
var lt = d.items['bc.label'].el.querySelector('text');
if (lt.textContent !== 'block [no input] / park') bad.push('transition label: ' + lt.textContent);
if (!lt.querySelector('.ed-tguard') || !lt.querySelector('.ed-tact')) bad.push('guard and action spans');
// the opposite pair runs apart, straight, the labels on either side
var p1 = ends(d, 'bc'), p2 = ends(d, 'cb');
near(Math.abs(p1[0][0] - p2[0][0]), 22, 'opposite transitions apart');
near(p1[0][0], p1[1][0], 'bc runs straight'); near(p2[0][0], p2[1][0], 'cb runs straight');
var lb1 = d.items['bc.label'].el.querySelector('rect').getBBox(), lb2 = d.items['cb.label'].el.querySelector('rect').getBBox();
if (!(lb1.x > Math.max(p1[0][0], p2[0][0]) && lb2.x + lb2.width < Math.min(p1[0][0], p2[0][0]))) bad.push('pair labels are not beside their wires');
// the self-transition is a loop at right angles on the right side, its label beside it
var sc = corners(d, 'self'), se = ends(d, 'self');
near(se[0][0], 590, 'loop leaves the right side'); near(se[1][0], 590, 'loop returns to the right side');
if (!(se[0][1] < se[1][1])) bad.push('loop runs clockwise');
if (/C|A/.test(d.items.self.path.getAttribute('d'))) bad.push('loop is curved');
var sl = d.items['self.label'].el.querySelector('rect').getBBox();
if (sl.x < 590 + 26) bad.push('loop label is not beside the loop');
// links inside the composite draw above its fill
var ce = d.items.comp.el;
['bc', 'cb', 'self'].forEach(function (id) { if (!(ce.compareDocumentPosition(d.items[id].el) & Node.DOCUMENT_POSITION_FOLLOWING)) bad.push(id + ' under the composite'); });
// a walk: each transition fires in the step that reaches its state
var W = d.walk(['init', 't0', 'a', 'go', 'comp', 'self', 'comp'], ['x', 'y', 'z', 'w']);
if (JSON.stringify(W) !== JSON.stringify([{current: 'init', caption: 'x'}, {fire: 't0', current: 'a', caption: 'y'}, {fire: 'go', current: 'comp', caption: 'z'}, {fire: 'self', current: 'comp', caption: 'w'}]))
  bad.push('walk: ' + JSON.stringify(W));
var ctl = d.steps(W);
function ring(id) { var h = d.items[id].el.querySelector('.ed-halo'); return h ? +getComputedStyle(h).opacity : 0; }
function width(id) { return parseFloat(getComputedStyle(d.items[id].path).strokeWidth); }
[2, 0, 3, 1, 2].forEach(function (k) {
  ctl.timeline.pause().seek('s' + k, false); ctl.flowsAt(k);
  var cur = W[k].current;
  ['init', 'a', 'comp'].forEach(function (id) { if (Math.abs(ring(id) - (id === cur ? 1 : 0)) > 0.02) bad.push('step ' + k + ': ring on ' + id + ' = ' + ring(id)); });
  ['t0', 'go', 'self'].forEach(function (id) { var on = W[k].fire === id; if ((width(id) > 3) !== on) bad.push('step ' + k + ': ' + id + ' width ' + width(id)); });
});

// ---------- horizontal lanes ----------
var e = EdgeDiagram.create(document.getElementById('ln'));
e.lanes('L', {x: 10, y: 10, w: 680, head: 100, pad: 20, lanes: [{id: 'ops', title: 'Operator'}, {id: 'hub', title: 'Hub', sub: 'central'}]});
e.node('s', {lane: 'ops', x: 130, w: 28, h: 28, shape: 'start'})
 .node('t1', {lane: 'ops', x: 200, w: 120, h: 56, shape: 'task', title: 'Register'})
 .node('dc', {lane: 'hub', x: 380, w: 120, h: 100, shape: 'decision', title: 'Valid?'})
 .node('t2', {lane: 'hub', x: 540, y: 10, w: 120, h: 40, shape: 'task', title: 'Sign'});
e.link('f1', {from: ['s', 'right'], to: ['t1', 'left'], arrow: 'end'})
 .link('f2', {from: ['t1', 'right'], to: ['dc', 'top'], arrow: 'end'})
 .link('f3', {from: ['dc', 'right'], to: ['t2', 'left'], arrow: 'end', label: 'yes'});
var r1 = e.items.ops.el.querySelector('.ed-zshape').getBBox(), r2 = e.items.hub.el.querySelector('.ed-zshape').getBBox();
near(r1.y, 10, 'first lane at the top'); near(r1.height, 100, 'a lane is at least its minimum');
near(r2.y, 110, 'second lane below the first'); near(r2.height, 140, 'a lane grows to hold its tallest node');
var dcb = e.items.dc.el.querySelector('.ed-shape').getBBox();
near(dcb.y, 130, 'a node without y is centred in its lane');
near(e.items.t2.el.querySelector('.ed-shape').getBBox().y, 120, 'a node with y sits that far from the lane top');
near(e.items.t1.el.querySelector('.ed-shape').getBBox().y, 32, 'a node is centred in its lane');
if (e.svg.getAttribute('viewBox') !== '0 0 700 260') bad.push('the view follows the lanes: ' + e.svg.getAttribute('viewBox'));
issues = e.check();
if (issues.length) bad.push('lanes: ' + issues.join(' / '));
near(ends(e, 'f1')[0][1], ends(e, 'f1')[1][1], 'a flow between a start event and a task runs straight');

// ---------- vertical lanes, with a node added after the links ----------
var v = EdgeDiagram.create(document.getElementById('vl'));
v.lanes('V', {x: 10, y: 10, h: 380, dir: 'vertical', lanes: [{id: 'a1', title: 'Site'}, {id: 'a2', title: 'Node'}]});
v.node('x1', {lane: 'a1', y: 80, w: 120, h: 50, shape: 'task', title: 'Install'})
 .node('x2', {lane: 'a2', y: 200, w: 120, h: 50, shape: 'task', title: 'Discover'});
v.link('vx', {from: ['x1', 'right'], to: ['x2', 'top'], arrow: 'end'});
v.node('x3', {lane: 'a1', y: 300, w: 260, h: 50, shape: 'task', title: 'A wide task'});
var w1 = v.items.a1.el.querySelector('.ed-zshape').getBBox();
near(w1.width, 304, 'a column grows to its widest node');
near(v.items.a2.el.querySelector('.ed-zshape').getBBox().x, 314, 'the next column moves over');
issues = v.check();   // like steps and bindFocus, it redraws the links of nodes that moved
if (issues.length) bad.push('vertical lanes: ' + issues.join(' / '));
near(ends(v, 'vx')[1][0], v.items.x2.el.querySelector('.ed-shape').getBBox().x + 60, 'a link follows a node its lane moved');

// ---------- the new checks ----------
var b = EdgeDiagram.create(document.getElementById('bad'));
b.lanes('B', {x: 10, y: 10, w: 400, head: 100, fit: false, lanes: [{id: 'l1', title: 'One'}]});
b.node('out', {lane: 'l1', x: 60, w: 100, h: 40, shape: 'task', title: 'In the head'})
 .node('k', {x: 450, y: 20, w: 240, h: 200, shape: 'composite', title: 'Composite with a title'})
 .node('k1', {x: 470, y: 30, w: 100, h: 40, title: 'On tab'})
 .node('dd', {x: 450, y: 260, w: 60, h: 40, shape: 'decision', title: 'Far too long for it?'})
 .node('m', {x: 20, y: 300, w: 80, h: 40, title: 'M'}).node('n', {x: 300, y: 300, w: 80, h: 40, title: 'N'})
 .node('u', {x: 160, y: 240, w: 40, h: 30, title: 'U'}).node('w', {x: 160, y: 360, w: 40, h: 30, title: 'W'});
b.link('mn', {from: ['m', 'right'], to: ['n', 'left'], arrow: 'end'})
 .transition('uw', {from: ['u', 'bottom'], to: ['w', 'top'], event: 'a long event name here', labelFixed: true});
expect(b.check(), ['node out is outside its lane l1', 'node k1 covers the title of composite k', 'runs outside the diamond of node dd',
  'label of transition uw lies on link mn'], 'broken figure');

// ---------- without GSAP: the walk still sets the ring ----------
var G = window.gsap; window.gsap = undefined;
var g = EdgeDiagram.create(document.getElementById('nog'));
g.node('p', {x: 20, y: 30, w: 80, h: 50, shape: 'state', title: 'P'}).node('q', {x: 200, y: 30, w: 80, h: 50, shape: 'state', title: 'Q'})
 .transition('pq', {from: 'p', to: 'q', event: 'go'});
var gc = g.steps(g.walk(['p', 'pq', 'q']));
gc.go(1);
if (+g.items.q.el.querySelector('.ed-halo').style.opacity !== 1 || +g.items.p.el.querySelector('.ed-halo').style.opacity !== 0) bad.push('no GSAP: ring not moved');
if (parseFloat(g.items.pq.path.style.strokeWidth) < 3) bad.push('no GSAP: fired link not thicker');
gc.go(0);
if (g.items.pq.path.style.strokeWidth) bad.push('no GSAP: fired link stays thick');
window.gsap = G;

document.getElementById('out').textContent = bad.length ? bad.join(' | ') : 'ok';
</script>
