<!-- Steps land on the right state after any jump, and a link between two chips draws above their parent. Run with scripts/test.sh. -->
<svg id="f" viewBox="0 0 600 200"></svg><pre id="out"></pre>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../lib/edgediagram.js"></script>
<script>
var d = EdgeDiagram.create(document.getElementById('f'), {check: false});
d.node('a', {x: 10, y: 10, w: 100, h: 50, title: 'A'}).node('b', {x: 200, y: 10, w: 100, h: 50, title: 'B'})
 .node('c', {x: 400, y: 10, w: 100, h: 50, title: 'C'})
 .link('ab', {from: ['a', 'right'], to: ['b', 'left'], route: 'straight'});
var ctl = d.steps([{show: ['a']}, {show: ['b', 'ab']}, {dim: ['a', 'b']}, {show: ['a', 'b']}, {hide: ['b', 'ab']}, {show: ['b', 'ab', 'c']}]);
function dash(id) { var p = d.items[id].path; return +(p.style.strokeDashoffset || 0); }
function op(id) { return (+getComputedStyle(d.items[id].el).opacity).toFixed(2); }
var want = {0: {a: 1, b: 0, c: 0}, 1: {a: 1, b: 1, c: 0}, 2: {a: .25, b: .25, c: 0}, 3: {a: 1, b: 1, c: 0}, 4: {a: 1, b: 0, c: 0}, 5: {a: 1, b: 1, c: 1}};
var bad = [];
function at(k, how) { ['a', 'b', 'c', 'ab'].forEach(function (id) { var w = id === 'ab' ? [0, 1, 1, 1, 0, 1][k] : want[k][id]; if (Math.abs(op(id) - w) > 0.02) bad.push(how + ' ' + k + ': ' + id + '=' + op(id) + ' want ' + w); }); }
// jumps in every order: forward to the end, then back to each step, then each step from each step
var order = [5, 0, 3, 1, 4, 2, 5, 2, 0, 4, 3, 5, 1];
order.forEach(function (k) { ctl.timeline.pause().seek('s' + k, false); at(k, 'seek'); if (want[k].b && dash('ab') > 1) bad.push('seek ' + k + ': ab undrawn'); });
// a chip's link draws above its parent
d.node('p', {x: 10, y: 100, w: 300, h: 90}).node('p1', {x: 20, y: 120, w: 80, h: 40, title: 'x'}).node('p2', {x: 200, y: 120, w: 80, h: 40, title: 'y'})
 .link('pp', {from: ['p1', 'right'], to: ['p2', 'left'], route: 'straight'});
var pe = d.items.p.el, le = d.items.pp.el;
if (!(pe.compareDocumentPosition(le) & Node.DOCUMENT_POSITION_FOLLOWING)) bad.push('chip link under its parent');
// forward animation finished: tween to the end
document.getElementById('out').textContent = bad.length ? bad.join(' | ') : 'ok';
</script>
